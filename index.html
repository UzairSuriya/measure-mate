<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MeasureMate</title>
</head>
<body>
    <main class="main">
        <div class="container">
            <div class="units-heading">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input type="text" id="input-el">
                <button id="btn-el" onclick="saveinput()">Convert</button>
            </div>
            <div class="units">
                <div class="length">
                    <h1>Length (Meter/Feet)</h1>
                    <p id="length-txt"></p>
                </div>
                <div class="volume">
                    <h1>Volume (Liters/Gallons)</h1>
                    <p id="volume-txt"></p>
                </div>
                <div class="mass">
                    <h1>Mass (Kilograms/Pounds)</h1>
                    <p id="mass-txt"></p>
                </div>
            </div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
